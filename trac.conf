<VirtualHost *:8123>
        ServerName trac.local
        DocumentRoot ${TRAC_DIR}/htdocs/
        WSGIScriptAlias / ${TRAC_DIR}/cgi-bin/trac.wsgi

        <Directory ${TRAC_DIR}/cgi-bin>
                WSGIApplicationGroup %{GLOBAL}
                Require all granted
        </Directory>
        <Location />
          AuthType Basic
          AuthName "${AUTH_NAME}"
          AuthUserFile ${TRAC_DIR}/.htpasswd
          Require valid-user
        </Location>
</VirtualHost>
